[package]
name = "timer-app"
version = "0.1.0"
description = "HIIT & Tabata Timer"
authors = ["Mario Araya"]
edition = "2021"

[lib]
name = "timer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
